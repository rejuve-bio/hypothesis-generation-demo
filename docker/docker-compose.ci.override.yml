version: '3.8'

# CI uses the Compose network and container healthchecks, so no service needs
# a published host port. Reset inherited ports to avoid shared-runner conflicts.
services:
  prolog-service:
    ports: !reset []

  dask-scheduler:
    ports: !reset []

  prefect-postgres:
    ports: !reset []

  credible-sets-postgres:
    ports: !reset []

  redis:
    ports: !reset []

  api-service:
    ports: !reset []

  dask-worker:
    command: >
      uv run dask worker tcp://dask-scheduler:8786
      --nworkers 2
      --nthreads 1
      --memory-limit 8GB
      --preload src.dask_preload

  prefect-service:
    ports: !reset []
    environment:
      - PREFECT_UI_API_URL=http://localhost:${PREFECT_UI_PORT}/api
