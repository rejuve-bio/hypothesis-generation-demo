# Pods accept traffic only from their own namespace; the API also from nginx (via NodePort).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-host
spec:
  podSelector:
    matchLabels: {app: hypothesis-api}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 5000, protocol: TCP}]
