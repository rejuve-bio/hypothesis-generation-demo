# Syncs Infisical (staging env) into Secret hypothesis-secrets. Host/project come from infisical.env (git-ignored).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hypothesis-infisical-sync
  namespace: hypothesis-wip
spec:
  hostAPI: INFISICAL_HOST_API                # set from infisical.env
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: INFISICAL_PROJECT_ID        # set from infisical.env
        envSlug: staging
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: hypothesis-wip
  managedSecretReference:
    secretName: hypothesis-secrets
    secretNamespace: hypothesis-wip
