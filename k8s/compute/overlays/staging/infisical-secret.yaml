# Syncs Infisical (staging env) into Secret hypothesis-secrets. Needs the Infisical operator.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hypothesis-infisical-sync
  namespace: hypothesis-staging
spec:
  hostAPI: https://app.rejuve.bio:8443/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: b0fd6db0-422a-4e25-ad07-31486e7c45bc
        envSlug: staging
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: hypothesis-staging
  managedSecretReference:
    secretName: hypothesis-secrets
    secretNamespace: hypothesis-staging
