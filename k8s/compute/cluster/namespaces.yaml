# Admin-applied. Pod Security: enforce baseline, warn/audit restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: hypothesis-staging
  labels:
    app.kubernetes.io/part-of: hypothesis-generation
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: hypothesis-wip
  labels:
    app.kubernetes.io/part-of: hypothesis-generation
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
