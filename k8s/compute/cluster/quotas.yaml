# Admin-applied. Per-branch resource caps on the shared compute server.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hypothesis-quota
  namespace: hypothesis-staging
spec:
  hard:
    requests.cpu: "40"
    limits.cpu: "80"
    requests.memory: 400Gi
    limits.memory: 640Gi
    requests.storage: 400Gi
    persistentvolumeclaims: "10"
    services.nodeports: "2"
    services.loadbalancers: "0"
    pods: "30"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hypothesis-quota
  namespace: hypothesis-wip
spec:
  hard:
    requests.cpu: "40"
    limits.cpu: "80"
    requests.memory: 400Gi
    limits.memory: 640Gi
    requests.storage: 400Gi
    persistentvolumeclaims: "10"
    services.nodeports: "2"
    services.loadbalancers: "0"
    pods: "30"
---
# Defaults for containers without explicit resources (required by the quota).
apiVersion: v1
kind: LimitRange
metadata:
  name: hypothesis-defaults
  namespace: hypothesis-staging
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 256Mi}
      default: {cpu: "1", memory: 2Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hypothesis-defaults
  namespace: hypothesis-wip
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 256Mi}
      default: {cpu: "1", memory: 2Gi}
