# Admin-applied. Read-only shared data; host paths are ro bind mounts (see README).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hypothesis-staging-reference-data
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: {namespace: hypothesis-staging, name: reference-data}
  hostPath: {path: /srv/k8s-ro/hypgen_data, type: Directory}
---
