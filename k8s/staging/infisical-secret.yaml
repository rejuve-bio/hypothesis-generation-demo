# Placeholders filled at apply time (values not kept in the repo):
#   sed -e "s#INFISICAL_HOST_API#$INFISICAL_HOST_API#" -e "s#INFISICAL_PROJECT_ID#$INFISICAL_PROJECT_ID#" infisical-secret.yaml | kubectl apply -f -
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hypothesis-infisical-sync
  namespace: hypothesis-staging
spec:
  hostAPI: INFISICAL_HOST_API
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: INFISICAL_PROJECT_ID
        envSlug: staging
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: hypothesis-staging
  managedSecretReference:
    secretName: hypothesis-secrets
    secretNamespace: hypothesis-staging
