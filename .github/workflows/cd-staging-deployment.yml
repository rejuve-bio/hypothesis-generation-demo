name: CD - Deploy to Kubernetes (staging)

on:
  repository_dispatch:
    types: [deploy-staging]

jobs:
  deploy-dev:
    runs-on: [self-hosted, dev-runner]
    steps:
      - name: Debug workflow info
        run: |
          echo "Event Type: ${{ github.event.action }}"
          echo "Image Tag: ${{ github.event.client_payload.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup kubectl (job-temp kubeconfig)
        env:
          KCFG_DATA: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          umask 077
          printf '%s\n' "$KCFG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          NAMESPACE="hypothesis-staging"
          TAG="${{ github.event.client_payload.image_tag }}"

          if [ -z "$TAG" ]; then
            TAG="staging"
          fi

          echo "Using image tag: $TAG"

          kubectl set image deployment/hypothesis-api \
            api=rejuvebio/hypothesis-generation-api-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prolog-service \
            prolog=rejuvebio/hypothesis-generation-prolog-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prefect-service \
            prefect-service=rejuvebio/hypothesis-generation-prefect-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prefect-deployment \
            prefect-deployment=rejuvebio/hypothesis-generation-prefect-deployment:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/dask-scheduler \
            dask-scheduler=rejuvebio/hypothesis-generation-dask-scheduler:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/dask-worker \
            dask-worker=rejuvebio/hypothesis-generation-dask-worker:${TAG} \
            -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/hypothesis-api -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prolog-service -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prefect-service -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prefect-deployment -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/dask-scheduler -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/dask-worker -n hypothesis-staging --timeout=180s

      - name: Verify all pods
        run: |
          kubectl get pods -n hypothesis-staging

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD Pipeline SUCCESS - Hypothesis Generation Deployed to Dev"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Deployment to the dev server completed successfully!

            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}

            All pods updated and running in staging namespace.
            Approve the deploy-staging job in this run to promote.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD Pipeline FAILED - Hypothesis Generation Dev Deploy"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Dev deployment failed!

            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}

            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

  deploy-staging:
    needs: deploy-dev
    environment: production
    runs-on: [self-hosted, prod-runner]
    steps:
      - name: Debug workflow info
        run: |
          echo "Event Type: ${{ github.event.action }}"
          echo "Image Tag: ${{ github.event.client_payload.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup kubectl (job-temp kubeconfig)
        env:
          KCFG_DATA: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          umask 077
          printf '%s\n' "$KCFG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          set -euo pipefail

          NAMESPACE="hypothesis-staging"
          TAG="${{ github.event.client_payload.image_tag }}"

          if [ -z "$TAG" ]; then
            TAG="staging"
          fi

          echo "Using image tag: $TAG"

          kubectl set image deployment/hypothesis-api \
            api=rejuvebio/hypothesis-generation-api-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prolog-service \
            prolog=rejuvebio/hypothesis-generation-prolog-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prefect-service \
            prefect-service=rejuvebio/hypothesis-generation-prefect-service:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/prefect-deployment \
            prefect-deployment=rejuvebio/hypothesis-generation-prefect-deployment:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/dask-scheduler \
            dask-scheduler=rejuvebio/hypothesis-generation-dask-scheduler:${TAG} \
            -n "$NAMESPACE"

          kubectl set image deployment/dask-worker \
            dask-worker=rejuvebio/hypothesis-generation-dask-worker:${TAG} \
            -n "$NAMESPACE"

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/hypothesis-api -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prolog-service -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prefect-service -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/prefect-deployment -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/dask-scheduler -n hypothesis-staging --timeout=180s
          kubectl rollout status deployment/dask-worker -n hypothesis-staging --timeout=180s

      - name: Verify all pods
        run: |
          kubectl get pods -n hypothesis-staging

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD Pipeline SUCCESS - Hypothesis Generation Deployed to K8s"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Deployment to Kubernetes completed successfully!

            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}

            All pods updated and running in staging namespace.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD Pipeline FAILED - Hypothesis Generation K8s Deploy"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Kubernetes deployment failed!

            Repository: ${{ github.repository }}
            Triggered by: ${{ github.actor }}

            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

  deploy-compute-staging:              
    if: vars.COMPUTE_STAGING_ENABLED == 'true'
    environment: compute-staging
    runs-on: [self-hosted, compute-staging-runner]
    env:
      NAMESPACE: hypothesis-staging
      TAG: ${{ github.event.client_payload.image_tag }}
      KUBECTL: /opt/kubectl
    steps:
      - name: Validate image tag
        run: |
          [ -z "$TAG" ] && TAG=staging
          [[ "$TAG" =~ ^staging(-[0-9a-f]{7}|-latest)?$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Update images
        run: |
          set -euo pipefail
          img() { $KUBECTL -n $NAMESPACE set image deployment/$1 $2=rejuvebio/hypothesis-generation-$3:$TAG; }
          img hypothesis-api     api                api-service
          img prolog-service     prolog             prolog-service
          img prefect-service    prefect-service    prefect-service
          img prefect-deployment prefect-deployment prefect-deployment
          img dask-scheduler     dask-scheduler     dask-scheduler
          img dask-worker        dask-worker        dask-worker

      - name: Wait for rollout
        run: |
          set -euo pipefail
          for d in dask-scheduler prefect-service prefect-deployment dask-worker; do
            $KUBECTL -n $NAMESPACE rollout status deployment/$d --timeout=15m
          done
          $KUBECTL -n $NAMESPACE rollout status deployment/hypothesis-api --timeout=100m   # GWAS seeding on first start
          $KUBECTL -n $NAMESPACE rollout status deployment/prolog-service --timeout=120m   # KG load
          $KUBECTL -n $NAMESPACE get pods

      - name: Notify
        if: always()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD compute-staging ${{ job.status }} - Hypothesis Generation"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            compute-staging deploy: ${{ job.status }} (tag ${{ env.TAG }})
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
