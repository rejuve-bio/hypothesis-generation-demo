name: CD - Deploy to Kubernetes (compute wip)

on:
  repository_dispatch:
    types: [deploy-wip]

permissions:
  contents: read

jobs:
  deploy-compute-wip:
    environment: compute-wip
    runs-on: [self-hosted, compute-wip-runner]
    env:
      NAMESPACE: hypothesis-wip
      TAG: ${{ github.event.client_payload.image_tag }}
      KUBECTL: /opt/kubectl
    steps:
      - name: Validate image tag
        run: |
          [ -z "$TAG" ] && TAG=wip
          [[ "$TAG" =~ ^wip(-[0-9a-f]{7}|-latest)?$ ]] || { echo "invalid tag: $TAG"; exit 1; }
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Update images
        run: |
          set -euo pipefail
          img() { $KUBECTL -n $NAMESPACE set image deployment/$1 $2=rejuvebio/hypothesis-generation-$3:$TAG; }
          img hypothesis-api     api                api-service
          img prolog-service     prolog             prolog-service
          img prefect-service    prefect-service    prefect-service
          img prefect-deployment prefect-deployment prefect-deployment
          img dask-scheduler     dask-scheduler     dask-scheduler
          img dask-worker        dask-worker        dask-worker

      - name: Wait for rollout
        run: |
          set -euo pipefail
          for d in dask-scheduler prefect-service prefect-deployment dask-worker; do
            $KUBECTL -n $NAMESPACE rollout status deployment/$d --timeout=15m
          done
          $KUBECTL -n $NAMESPACE rollout status deployment/hypothesis-api --timeout=100m   # GWAS seeding on first start
          $KUBECTL -n $NAMESPACE rollout status deployment/prolog-service --timeout=120m   # KG load
          $KUBECTL -n $NAMESPACE get pods

      - name: Notify
        if: always()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CD compute-wip ${{ job.status }} - Hypothesis Generation"
          to: ${{ secrets.RECIEVER_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            compute-wip deploy: ${{ job.status }} (tag ${{ env.TAG }})
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
